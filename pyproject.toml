[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorda"
version = "0.1.0"
description = "排水管网在线监测数据定期诊断工作流（雨污混接 / RDII / 等效混接面积 / 响应时滞）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "MrBrenda", email = "this.is.wangx@gmail.com" }]
keywords = ["urban-drainage", "RDII", "monitoring", "pipe-network", "diagnosis"]

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "matplotlib>=3.9",
  "geopandas>=1.0",
  "shapely>=2.0",
  "networkx>=3.3",
  "python-docx>=1.1",
  "jinja2>=3.1",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pandera>=0.20",
  "openpyxl>=3.1",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
]

[project.scripts]
monitorda = "monitorda.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["monitorda*"]

[tool.setuptools.package-data]
monitorda = ["templates/*.j2", "templates/*.docx"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "regression: 0423 docx regression tests (skipped if raw data absent)",
]
