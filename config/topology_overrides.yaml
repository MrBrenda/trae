# 拓扑/属性纠错 patch 层
# data/external/network.shp 是 source-of-truth（只读）。
# 在 shp 之外发现的错误或后期补录的信息写到这里，spatial.load_network() 会在加载时叠加。
#
# 支持四类操作：
#   nodes:    add / set / flags
#   links:    add / remove / set
#   catchment_overrides:   覆盖某节点的汇水区面积
#   rainfall_assignments:  覆盖站点 → 节点的归属（详见 stations_rainfall.yaml）

nodes: {}
  # 示例：
  # W14:
  #   add: { lon: 108.xxxx, lat: 34.xxxx, diameter_m: 0.8 }
  #   set: { pipe_material: "concrete" }
  #   flags: { suspect_illicit: true, reason: "现场 2026-03 复核" }

links:
  add: []
  remove: []
  set: []
  # 示例：
  # add:
  #   - { from: W12, to: W13, length_m: 180, diameter_m: 0.6 }
  # remove:
  #   - { from: S07, to: S08 }
  # set:
  #   - { from: W15, to: W16, attrs: { length_m: 215 } }

catchment_overrides: {}
  # 示例：
  # S03: { area_km2_override: 0.42, note: "shp 漏画一条车道" }
